# stock.awam.wang — Nest / Socket.IO 反代
map $http_upgrade $connection_upgrade_stock {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name stock.awam.wang;

    root /var/www/html;

    location /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stock.awam.wang;

    ssl_certificate     /etc/nginx/ssl/stock.awam.wang/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/stock.awam.wang/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_stock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
